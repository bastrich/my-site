name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy-bastrich-tech
  cancel-in-progress: false

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6.1.0
        with:
          node-version: '24'

      - name: Install minify/obfuscate tools
        run: |
          npm install -g html-minifier-terser clean-css-cli terser javascript-obfuscator

      - name: Prepare dist directory
        run: |
          rm -rf dist
          mkdir dist
          mkdir dist/perfect-code-review
          mkdir dist/story-points
          mkdir dist/coupling-and-cohesion
          cp -R img dist
          cp -R perfect-code-review/img dist/perfect-code-review/img
          cp -R story-points/img dist/story-points/img
          cp -R coupling-and-cohesion/img dist/coupling-and-cohesion/img
          cp favicon.ico dist
          cp favicon.svg dist
          cp robots.txt dist
          cp sitemap.xml dist
          cp rss.xml dist
          cp infra/cloudflare/_headers dist

      - name: Add cache-busting version to CSS/JS imports
        run: |
          VERSION="${{ github.run_number }}"
          for file in "index.html" "perfect-code-review/index.html" "story-points/index.html" "coupling-and-cohesion/index.html"; do
            sed -i 's|href="css/main/main.css"|href="main.css"|g' "$file"
            sed -i 's|href="../css/article/article.css"|href="../article.css"|g' "$file"
            sed -i -E 's/(href="[^"]+\.css)(")/\1?v='"$VERSION"'\2/g' "$file"
            sed -i -E 's/(src="[^"]+\.js)(")/\1?v='"$VERSION"'\2/g' "$file"
          done

      - name: Minify HTML
        run: |
          for file in "index.html" "perfect-code-review/index.html" "story-points/index.html" "coupling-and-cohesion/index.html"; do
            html-minifier-terser \
            --collapse-whitespace \
            --remove-comments \
            --remove-redundant-attributes \
            --remove-script-type-attributes \
            --remove-style-link-type-attributes \
            --use-short-doctype \
            --minify-css true \
            --minify-js true \
            "$file" -o "dist/$file"
          done

      - name: Minify and bundle CSS
        run: |
          cleancss --inline all -o "dist/main.css" "css/main/main.css"
          cleancss --inline all -o "dist/article.css" "css/article/article.css"

      - name: Minify and obfuscate JS
        run: |
          for file in "index.js" "image-modal.js" "share.js"; do
            terser "$file" -c -m -o "dist/$file"
            javascript-obfuscator "dist/$file" --output "dist/$file"
          done

      - name: Configure Cloudflare zone
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -eo pipefail
          cf() {
            curl -sS --fail-with-body -X "$1" \
              "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/$2" \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$3" | jq -e '.success' > /dev/null
          }
          cf PATCH settings/always_use_https '{"value":"on"}'
          cf PUT rulesets/phases/http_request_dynamic_redirect/entrypoint \
            "$(jq '{rules: .}' infra/cloudflare/redirect_rules.json)"

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

